<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Мій список цілей</title>
  <style>
  body { 
    font-family: sans-serif; 
    max-width: 450px; 
    margin: 40px auto; 
    padding: 20px; 
  }
  #form {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
  }

  #input {
    flex: 1;
    padding: 6px 10px;
  }

  .completed span { 
    text-decoration: line-through; 
    opacity: 0.6; 
  }
  .error { 
    color: red; 
    font-size: 13px; 
    display: block; 
    margin-bottom: 10px; 
  }
  
  ul {
    padding-left: 0;
    list-style: none;
  }

  li { 
    display: flex; 
    align-items: center; 
    gap: 12px;
    margin-top: 8px; 
  }

  li label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    flex: 1; 
  }

  p, div {
    margin-bottom: 10px;
  }

  li[hidden] {
    display: none !important;
  }
</style>
</head>
<body>

  <h1>Мій список цілей</h1>

  <form id="form">
    <input type="text" id="input" placeholder="Введіть ціль...">
    <button type="submit">Додати</button>
    <span id="error" class="error"></span>
  </form>

  <p id="counter">Усього: 0. Виконано: 0</p>

  <div>
    <button class="filter" data-filter="all">Усі</button>
    <button class="filter" data-filter="active">Активні</button>
    <button class="filter" data-filter="completed">Виконані</button>
  </div>
  <p id="empty">Поки що цілей немає</p>
  <ul id="list"></ul>

  <script src="script.js"></script>
</body>
</html>
